[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-execution-monitor"
version = "0.1.0"
description = "A deterministic, public-safe trading execution reliability demonstration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase / Codex" }]
dependencies = []

[project.optional-dependencies]
demo = ["Pillow>=10"]

[project.scripts]
execution-monitor = "execution_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
execution_monitor = ["static/*.html", "static/*.css", "static/*.js"]
